<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Отзывы — Сепарация</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body style="margin:0;background:#f7f3ee;">

<section class="sv" id="separation-reviews" aria-labelledby="sv-title">

  <div class="sv__grain" aria-hidden="true"></div>

  <!-- ─── HEADER ─── -->
  <div class="sv__header" data-sv-reveal>
    <div class="sv__eyebrow">
      <span class="sv__pip" aria-hidden="true"></span>
      Отзывы
    </div>
    <h2 class="sv__title" id="sv-title">
      Что говорят те,
      <em class="sv__title-em">кто уже прошёл программу</em>
    </h2>
  </div>

  <!-- ─── SCROLL TRACK ─── -->
  <div class="sv__scroll-wrap" data-sv-reveal>

    <!-- arrows -->
    <button class="sv__arrow sv__arrow--prev" id="sv-prev" aria-label="Предыдущие отзывы">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M11 14L6 9l5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="sv__arrow sv__arrow--next" id="sv-next" aria-label="Следующие отзывы">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M7 4l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="sv__track" id="sv-track" role="list">

      <div class="sv__card" role="listitem">
        <img class="sv__img" src="https://individual-center.com/wp-content/uploads/2026/05/photo_2569-05-15-00.11.03.jpeg" alt="Отзыв клиента" loading="lazy" />
      </div>

      <div class="sv__card" role="listitem">
        <img class="sv__img" src="https://individual-center.com/wp-content/uploads/2026/05/photo_2569-05-15-00.11.05.jpeg" alt="Отзыв клиента" loading="lazy" />
      </div>

      <div class="sv__card" role="listitem">
        <img class="sv__img" src="https://individual-center.com/wp-content/uploads/2026/05/photo_2569-05-15-00.11.06.jpeg" alt="Отзыв клиента" loading="lazy" />
      </div>

      <div class="sv__card" role="listitem">
        <img class="sv__img" src="https://individual-center.com/wp-content/uploads/2026/05/photo_2569-05-15-00.11.09.jpeg" alt="Отзыв клиента" loading="lazy" />
      </div>

      <div class="sv__card" role="listitem">
        <img class="sv__img" src="https://individual-center.com/wp-content/uploads/2026/05/photo_2569-05-15-00.11.11.jpeg" alt="Отзыв клиента" loading="lazy" />
      </div>

      <div class="sv__card" role="listitem">
        <img class="sv__img" src="https://individual-center.com/wp-content/uploads/2026/05/photo_2569-05-15-00.11.13.jpeg" alt="Отзыв клиента" loading="lazy" />
      </div>

      <div class="sv__card" role="listitem">
        <img class="sv__img" src="https://individual-center.com/wp-content/uploads/2026/05/photo_2569-05-15-00.11.15.jpeg" alt="Отзыв клиента" loading="lazy" />
      </div>

      <div class="sv__card" role="listitem">
        <img class="sv__img" src="https://individual-center.com/wp-content/uploads/2026/05/photo_2569-05-15-00.11.16.jpeg" alt="Отзыв клиента" loading="lazy" />
      </div>

    </div>

    <!-- fade edges -->
    <div class="sv__fade sv__fade--left"  aria-hidden="true"></div>
    <div class="sv__fade sv__fade--right" aria-hidden="true"></div>
  </div>

  <!-- ─── PROGRESS BAR ─── -->
  <div class="sv__progress-wrap" data-sv-reveal>
    <div class="sv__progress-track">
      <div class="sv__progress-bar" id="sv-bar"></div>
    </div>
  </div>

</section>


<style>
/* ================================================================
   SEP REVIEWS — horizontal scroll gallery
================================================================ */

.sv {
  --gold:    #c9a96e;
  --gold-lt: #e2c98a;
  --gold-dk: #a07840;
  --ink:     #1a1714;
  --ink-55:  rgba(26,23,20,.55);
  --border:  rgba(201,169,110,.18);
  --bg:      #f4efe6;
  --ease:    cubic-bezier(.22,.68,0,1.2);
}

.sv *, .sv *::before, .sv *::after { box-sizing: border-box; margin: 0; padding: 0; }

.sv {
  position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 55% 40% at 80% 10%, rgba(201,169,110,.06) 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 15% 90%, rgba(201,169,110,.05) 0%, transparent 50%),
    linear-gradient(158deg, #f4efe6 0%, #faf8f3 55%, #ede6da 100%);
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--ink);
  padding-bottom: 100px;
}

.sv__grain {
  position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px;
}

/* ══════════════
   REVEAL
══════════════ */
[data-sv-reveal] {
  opacity: 0; transform: translateY(22px);
  animation: sv-reveal .8s var(--ease) forwards;
}
.sv__header[data-sv-reveal]        { animation-delay: .04s; }
.sv__scroll-wrap[data-sv-reveal]   { animation-delay: .16s; }
.sv__progress-wrap[data-sv-reveal] { animation-delay: .26s; }
@keyframes sv-reveal { to { opacity: 1; transform: translateY(0); } }

/* ══════════════
   HEADER
══════════════ */
.sv__header {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  padding: 100px 8vw 56px;
}

.sv__eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 16px; border-radius: 999px;
  background: rgba(201,169,110,.10); border: 1px solid var(--border);
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: #9c7a3a; font-weight: 500; margin-bottom: 28px;
}
.sv__pip {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 3px rgba(201,169,110,.22);
  flex-shrink: 0; animation: sv-pip 2.4s ease-in-out infinite;
}
@keyframes sv-pip {
  0%,100% { box-shadow: 0 0 0 3px rgba(201,169,110,.22); }
  50%      { box-shadow: 0 0 0 7px rgba(201,169,110,.05); }
}

.sv__title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(38px, 4.8vw, 72px);
  font-weight: 600; line-height: 1.04; letter-spacing: -.025em;
  color: var(--ink); max-width: 820px;
}
.sv__title-em {
  display: block; font-style: italic; font-weight: 400; margin-top: .08em;
  background: linear-gradient(128deg, var(--gold-lt) 0%, var(--gold) 45%, var(--gold-dk) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ══════════════
   SCROLL WRAP
══════════════ */
.sv__scroll-wrap {
  position: relative; z-index: 1;
}

.sv__track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  gap: 12px;
  padding: 12px 8vw 52px;
  cursor: grab;
}
.sv__track::-webkit-scrollbar { display: none; }
.sv__track.dragging { cursor: grabbing; scroll-snap-type: none; }

/* fade edges */
.sv__fade {
  position: absolute; top: 0; bottom: 0; width: 8vw;
  pointer-events: none; z-index: 2;
}
.sv__fade--left {
  left: 0;
  background: linear-gradient(90deg, #f4efe6 0%, transparent 100%);
}
.sv__fade--right {
  right: 0;
  background: linear-gradient(270deg, #f4efe6 0%, transparent 100%);
}

/* ══════════════
   ARROWS
══════════════ */
.sv__arrow {
  position: absolute; top: 50%; z-index: 3;
  transform: translateY(calc(-50% - 20px));
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,.85);
  border: 1px solid rgba(201,169,110,.25);
  color: var(--ink-55);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 20px rgba(26,23,20,.08), 0 0 0 1px rgba(255,255,255,.8) inset;
  transition: background .2s ease, color .2s ease, border-color .2s ease,
              box-shadow .2s ease, transform .2s var(--ease), opacity .2s ease;
}
.sv__arrow:hover {
  background: rgba(255,255,255,.98);
  border-color: rgba(201,169,110,.5);
  color: var(--gold-dk);
  box-shadow: 0 8px 28px rgba(201,169,110,.18), 0 0 0 1px rgba(255,255,255,.9) inset;
  transform: translateY(calc(-50% - 20px)) scale(1.08);
}
.sv__arrow:active { transform: translateY(calc(-50% - 20px)) scale(.96); }
.sv__arrow--prev { left: calc(8vw - 22px); }
.sv__arrow--next { right: calc(8vw - 22px); }
.sv__arrow.disabled { opacity: .28; pointer-events: none; }

/* ══════════════
   CARDS
══════════════ */
.sv__card {
  /* 5 cards visible + ~50px peek of 6th */
  flex: 0 0 calc((100vw - 16vw - 4 * 12px - 50px) / 5);
  scroll-snap-align: start;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(201,169,110,.18);
  box-shadow:
    0 4px 24px rgba(26,23,20,.07),
    0 0 0 1px rgba(255,255,255,.75) inset;
  background: rgba(255,255,255,.55);
  transition: transform .3s var(--ease), box-shadow .3s ease;
}
.sv__card:hover {
  transform: translateY(-4px);
  box-shadow:
    0 14px 40px rgba(26,23,20,.10),
    0 0 0 1px rgba(255,255,255,.9) inset,
    0 0 0 2px rgba(201,169,110,.14);
}

.sv__img {
  display: block;
  width: 100%; height: auto;
}

/* ══════════════
   PROGRESS BAR
══════════════ */
.sv__progress-wrap {
  position: relative; z-index: 1;
  padding: 0 8vw;
  margin-top: 28px;
}

.sv__progress-track {
  height: 2px;
  background: rgba(201,169,110,.15);
  border-radius: 999px;
  overflow: hidden;
}

.sv__progress-bar {
  height: 100%;
  width: 20%;
  background: linear-gradient(90deg, var(--gold-lt), var(--gold));
  border-radius: 999px;
  transition: width .1s ease;
}

/* ================================================================
   RESPONSIVE
================================================================ */

@media (max-width: 1024px) {
  /* 4 cards + peek */
  .sv__card { flex: 0 0 calc((100vw - 16vw - 3 * 12px - 50px) / 4); }
}

@media (max-width: 760px) {
  /* 2 cards + peek */
  .sv__card { flex: 0 0 calc((100vw - 16vw - 12px - 48px) / 2); }
  .sv__arrow { display: none; }
}

@media (max-width: 540px) {
  .sv__header { padding: 80px 20px 48px; }
  .sv__track { padding: 12px 20px 48px; gap: 10px; }
  .sv__fade { width: 20px; }
  .sv__fade--left  { background: linear-gradient(90deg,  #f4efe6 0%, transparent 100%); }
  .sv__fade--right { background: linear-gradient(270deg, #f4efe6 0%, transparent 100%); }
  /* 1 card + ~48px peek */
  .sv__card { flex: 0 0 calc(100vw - 40px - 10px - 48px); }
  .sv__progress-wrap { padding: 0 20px; }
}
</style>


<script>
(function () {
  var track = document.getElementById('sv-track');
  var bar   = document.getElementById('sv-bar');
  var prev  = document.getElementById('sv-prev');
  var next  = document.getElementById('sv-next');

  /* ── card width for step ── */
  function cardStep() {
    var card = track.querySelector('.sv__card');
    if (!card) return 300;
    return card.offsetWidth + parseInt(getComputedStyle(track).gap || 12);
  }

  /* ── progress bar ── */
  function updateUI() {
    var max = track.scrollWidth - track.clientWidth;
    var pct = max > 0 ? (track.scrollLeft / max) * 100 : 0;
    bar.style.width = (20 + pct * 0.8) + '%';
    prev.classList.toggle('disabled', track.scrollLeft <= 2);
    next.classList.toggle('disabled', track.scrollLeft >= max - 2);
  }

  track.addEventListener('scroll', updateUI, { passive: true });
  updateUI();

  /* ── arrow clicks ── */
  prev.addEventListener('click', function () {
    track.scrollBy({ left: -cardStep(), behavior: 'smooth' });
  });
  next.addEventListener('click', function () {
    track.scrollBy({ left: cardStep(), behavior: 'smooth' });
  });

  /* ── drag to scroll ── */
  var startX, startLeft, dragging = false;

  track.addEventListener('mousedown', function (e) {
    dragging = true;
    startX = e.pageX;
    startLeft = track.scrollLeft;
    track.classList.add('dragging');
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    track.scrollLeft = startLeft - (e.pageX - startX);
  });
  window.addEventListener('mouseup', function () {
    dragging = false;
    track.classList.remove('dragging');
  });
})();
</script>

</body>
</html>
